    <script>
        // Randomize product image on homepage and store selection for product page
        document.addEventListener('DOMContentLoaded', function() {
            const productImage = document.querySelector('#shop .products-grid img');
            if (productImage) {
                const images = [
                    '../images+logo/tokiiidea slikica za web.jpg',
                    '../images+logo/web 2.jpg',
                    '../images+logo/web 3.jpg',
                    '../images+logo/web 4.jpg'
                ];
                const randomIndex = Math.floor(Math.random() * images.length);
                // Store the selected index in localStorage for product page to use
                localStorage.setItem('selectedKoriImageIndex', randomIndex);
                productImage.src = images[randomIndex];
                productImage.alt = 'Kori';
            }

            const bannerSlides = Array.from(document.querySelectorAll('.banner-slide'));
            const bannerDots = Array.from(document.querySelectorAll('.banner-dot'));
            const bannerArrows = Array.from(document.querySelectorAll('.banner-arrow'));
            if (bannerSlides.length > 1) {
                let activeBannerIndex = 0;
                const reducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
                let bannerTimer;

                function showBanner(index) {
                    activeBannerIndex = (index + bannerSlides.length) % bannerSlides.length;
                    bannerSlides.forEach((slide, slideIndex) => {
                        slide.classList.toggle('is-active', slideIndex === activeBannerIndex);
                    });
                    const bannerProductTag = document.querySelector('.banner-product-tag');
                    if (bannerProductTag) {
                        const isVisible = activeBannerIndex === 0;
                        bannerProductTag.classList.toggle('is-visible', isVisible);
                        bannerProductTag.tabIndex = isVisible ? 0 : -1;
                    }
                    bannerDots.forEach((dot, dotIndex) => {
                        const isActive = dotIndex === activeBannerIndex;
                        dot.classList.toggle('is-active', isActive);
                        dot.setAttribute('aria-current', String(isActive));
                    });
                }

                function startBannerTimer() {
                    window.clearInterval(bannerTimer);
                    if (!reducedMotion) {
                        bannerTimer = window.setInterval(() => {
                            showBanner(activeBannerIndex + 1);
                        }, 6000);
                    }
                }

                bannerArrows[0]?.addEventListener('click', () => {
                    showBanner(activeBannerIndex - 1);
                    startBannerTimer();
                });
                bannerArrows[1]?.addEventListener('click', () => {
                    showBanner(activeBannerIndex + 1);
                    startBannerTimer();
                });
                bannerDots.forEach((dot, dotIndex) => {
                    dot.addEventListener('click', () => {
                        showBanner(dotIndex);
                        startBannerTimer();
                    });
                });
                startBannerTimer();
            }
        });
    </script>
    <script>
        // Cart count update
        const CART_KEY = 'tkiidea-cart';

        function getCart() {
            const cart = localStorage.getItem(CART_KEY);
            return cart ? JSON.parse(cart) : [];
        }

        function getCartCount() {
            return getCart().reduce((sum, item) => sum + item.quantity, 0);
        }

        function updateCartCount() {
            const count = getCartCount();
            const cartCountEl = document.querySelector('.cart-count');
            if (cartCountEl) {
                // Smooth animation: fade out and scale down, then back
                cartCountEl.classList.add('update');
                // Update count after a short delay to allow animation to start
                setTimeout(() => {
                    cartCountEl.textContent = count;
                }, 50);
                // Remove update class after animation ends
                setTimeout(() => {
                    cartCountEl.classList.remove('update');
                }, 300);
                // Hide if zero
                if (count === 0) {
                    cartCountEl.style.display = 'none';
                } else {
                    cartCountEl.style.display = 'flex';
                }
            }
        }

        // Update on load
        document.addEventListener('DOMContentLoaded', updateCartCount);
        // Update when cart changes in another tab
        window.addEventListener('storage', (e) => {
            if (e.key === CART_KEY) {
                updateCartCount();
            }
        });
    </script>
