<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Tokiidea</title>
    <link rel="stylesheet" href="css/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;600&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600&display=swap" rel="stylesheet">
</head>
<body>
    <!-- Header -->
    <header>
        <div class="nav-container">
            <a href="index.html" class="logo"><img src="images+logo/tokiidea prof pic 2.jpg" alt="Tokiidea logo" style="height: 64px;"></a>
        </div>
        <a href="cart.html" class="cart-basket" aria-label="Cart">
            <svg width="28" height="28" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
                <path d="M8 10V8c0-4.5 8-4.5 8 0v2" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
                <path d="M4 9.5c4.8 1.5 11.2 1.5 16 0M4.8 10.2c.6 5.4 3.1 8.8 7.2 8.8s6.6-3.4 7.2-8.8" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
                <path d="M5.8 13.5c3.9 1 8.5 1 12.4 0M7.4 16.3c2.9.7 6.3.7 9.2 0" stroke="currentColor" stroke-width="1.1" stroke-linecap="round"/>
                <path d="m9.5 10.5.8 8m3.4-8-.8 8" stroke="currentColor" stroke-width="1.1" stroke-linecap="round"/>
            </svg>
            <span class="cart-count" aria-live="polite"></span>
        </a>
    </header>
    <!-- Image Slider -->
    <section class="image-slider"></section>

    <!-- Contact Section -->
    <section class="section" id="contact">
        <div class="container">
            <h2 class="section-title">Get in Touch</h2>
            <div style="max-width: 600px; margin: 0 auto;">
                <p>Have questions, custom requests, or just want to say hello? We'd love to hear from you!</p>
                <form id="contact-form" name="contact" method="POST" data-netlify="true" netlify-honeypot="bot-field" style="margin-top: var(--spacing-lg);">
                    <input type="hidden" name="form-name" value="contact">
                    <p hidden>
                        <label>Leave this field empty: <input name="bot-field"></label>
                    </p>
                    <div style="margin-bottom: var(--spacing-md);">
                        <label for="name" style="display: block; margin-bottom: var(--spacing-xs);">Your Name</label>
                        <input type="text" id="name" name="name" required style="width: 100%; padding: var(--spacing-sm); border: 1px solid var(--neutral-light); border-radius: var(--radius-sm); font-family: var(--font-body);">
                    </div>
                    <div style="margin-bottom: var(--spacing-md);">
                        <label for="email" style="display: block; margin-bottom: var(--spacing-xs);">Email Address</label>
                        <input type="email" id="email" name="email" required style="width: 100%; padding: var(--spacing-sm); border: 1px solid var(--neutral-light); border-radius: var(--radius-sm); font-family: var(--font-body);">
                    </div>
                    <div style="margin-bottom: var(--spacing-md);">
                        <label for="message" style="display: block; margin-bottom: var(--spacing-xs);">Message</label>
                        <textarea id="message" name="message" rows="5" required style="width: 100%; padding: var(--spacing-sm); border: 1px solid var(--neutral-light); border-radius: var(--radius-sm); font-family: var(--font-body);"></textarea>
                    </div>
                    <button type="submit" class="cta-button" style="width: 100%; max-width: 300px;">Send Message</button>
                </form>
                <p id="form-status" style="margin-top: var(--spacing-md); text-align: center; min-height: 1.5rem;"></p>
            </div>
        </div>
    </section>

    <!-- Footer -->
    <footer>
        <div class="footer-container">
            <div class="footer-section">
                <h3>Information</h3>
                <ul>
                    <li><a href="contact.html">Contact</a></li>
                    <li><a href="faq.html">FAQ</a></li>
                    <li><a href="shipping.html">Shipping</a></li>
                    <li><a href="returns.html">Returns</a></li>
                    <li><a href="privacy.html">Privacy</a></li>
                    <li><a href="terms.html">Terms</a></li>
                    <li><a href="cookies.html">Cookies</a></li>
                </ul>
            </div>
        </div>

        <div class="footer-bottom">
            <p>&copy; Tokiidea. All rights reserved. | Made with  for handmade lovers</p>
            <div class="language-toggle" role="group" aria-label="Language">
                <span class="language-toggle-current" lang="en" aria-current="true">EN</span>
                <span class="language-toggle-divider" aria-hidden="true">·</span>
                <button class="language-toggle-soon" type="button" lang="sl" disabled title="Slovenian translation coming soon">SL</button>
            </div>
        </div>
    </footer>
    <script src="cart-count.js?v=2"></script>
    <script src="cookie-notice.js?v=2"></script>
    <script src="bubble-cursor.js"></script>
    <script src="language.js"></script>
</body>
</html>
