<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tokiidea - Phone Preview</title>
    <style>
        * {
            box-sizing: border-box;
        }

        html,
        body {
            width: 100%;
            min-height: 100%;
            margin: 0;
        }

        body {
            display: grid;
            min-height: 100vh;
            min-height: 100dvh;
            place-items: center;
            background: #ead7f2;
        }

        iframe {
            display: block;
            width: min(390px, 100vw);
            height: 844px;
            border: 0;
            background: #f5eed8;
            box-shadow: 0 8px 32px rgba(64, 56, 67, 0.18);
        }
    </style>
</head>
<body>
    <iframe src="index.html?phone-preview=1" title="Tokiidea shop phone preview"></iframe>
</body>
</html>
